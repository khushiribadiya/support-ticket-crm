<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Dashboard - Support CRM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex">

  <aside class="w-56 bg-white border-r border-gray-200 hidden md:flex flex-col p-5">
    <h1 class="text-xl font-bold text-indigo-600 mb-8">Support CRM</h1>
    <nav class="flex flex-col gap-2">
      <a href="index.html" class="px-3 py-2 rounded-lg bg-indigo-50 text-indigo-700 font-medium">Dashboard</a>
      <a href="create.html" class="px-3 py-2 rounded-lg text-gray-600 hover:bg-gray-100">Create Ticket</a>
    </nav>
  </aside>

  <main class="flex-1 p-4 md:p-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-semibold text-gray-800">Dashboard</h2>
      <a href="create.html" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
        + New Ticket
      </a>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-sm text-gray-500">Open</p>
        <p id="countOpen" class="text-2xl font-bold text-red-500">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-sm text-gray-500">In Progress</p>
        <p id="countProgress" class="text-2xl font-bold text-yellow-500">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-sm text-gray-500">Closed</p>
        <p id="countClosed" class="text-2xl font-bold text-green-600">0</p>
      </div>
      <div class="bg-white rounded-xl shadow-sm p-4 border border-gray-100">
        <p class="text-sm text-gray-500">Total Tickets</p>
        <p id="countTotal" class="text-2xl font-bold text-indigo-600">0</p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 mb-4">
      <input id="searchInput" type="text" placeholder="Search by name, email, ticket id, subject..."
        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <select id="statusFilter" class="border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
        <option value="All">All Status</option>
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
      <table class="w-full text-sm text-left">
        <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
          <tr>
            <th class="px-5 py-3">Ticket ID</th>
            <th class="px-5 py-3">Customer</th>
            <th class="px-5 py-3">Subject</th>
            <th class="px-5 py-3">Status</th>
            <th class="px-5 py-3">Created</th>
          </tr>
        </thead>
        <tbody id="ticketTableBody">
        </tbody>
      </table>

      <div id="loadingSpinner" class="flex justify-center py-8">
        <div class="w-8 h-8 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
      </div>

      <div id="emptyState" class="hidden text-center py-10 text-gray-400">
        No tickets found.
      </div>
    </div>
  </main>

  <script src="app.js"></script>
  <script>
    let searchTimer = null;

    async function loadTickets() {
      const spinner = document.getElementById("loadingSpinner");
      const emptyState = document.getElementById("emptyState");
      const tbody = document.getElementById("ticketTableBody");

      spinner.classList.remove("hidden");
      emptyState.classList.add("hidden");
      tbody.innerHTML = "";

      const search = document.getElementById("searchInput").value.trim();
      const status = document.getElementById("statusFilter").value;

      const params = new URLSearchParams();
      if (search) params.append("search", search);
      if (status && status !== "All") params.append("status", status);

      try {
        const res = await fetch(`${API_BASE}?${params.toString()}`);
        if (!res.ok) throw new Error("Failed to load tickets");
        const tickets = await res.json();

        spinner.classList.add("hidden");

        if (tickets.length === 0) {
          emptyState.classList.remove("hidden");
        } else {
          tickets.forEach((t) => {
            const row = document.createElement("tr");
            row.className = "border-t border-gray-100 hover:bg-gray-50 cursor-pointer";
            row.onclick = () => (window.location.href = `ticket.html?id=${t.ticket_id}`);
            row.innerHTML = `
              <td class="px-5 py-3 font-medium text-indigo-600">${t.ticket_id}</td>
              <td class="px-5 py-3">${t.customer_name}</td>
              <td class="px-5 py-3">${t.subject}</td>
              <td class="px-5 py-3">
                <span class="px-2 py-1 rounded-full text-xs font-medium ${statusBadgeClass(t.status)}">${t.status}</span>
              </td>
              <td class="px-5 py-3 text-gray-500">${formatDate(t.created_at)}</td>
            `;
            tbody.appendChild(row);
          });
        }

        updateSummaryCards(tickets, status);
      } catch (err) {
        spinner.classList.add("hidden");
        showToast("Could not load tickets", true);
      }
    }

    async function updateSummaryCards() {
      try {
        const res = await fetch(API_BASE);
        const all = await res.json();
        document.getElementById("countTotal").textContent = all.length;
        document.getElementById("countOpen").textContent = all.filter((t) => t.status === "Open").length;
        document.getElementById("countProgress").textContent = all.filter((t) => t.status === "In Progress").length;
        document.getElementById("countClosed").textContent = all.filter((t) => t.status === "Closed").length;
      } catch (err) {
      }
    }

    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(loadTickets, 300);
    });

    document.getElementById("statusFilter").addEventListener("change", loadTickets);

    loadTickets();
  </script>
</body>
</html>
